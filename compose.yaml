services:
  nginx:
    image: lscr.io/linuxserver/nginx:latest
    container_name: nginx
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
      - NGINX_AUTORELOAD= #optional
      - NGINX_AUTORELOAD_WATCHLIST= #optional
    volumes:
      - nginx_config:/config
    #ports:
    #  - 80:80
    #  - 443:443
    restart: unless-stopped

volumes:
  nginx_config:
    driver_opts:
      type: "nfs"
      o: ${NGINX_NFS_PATH}
      device: ${NGINX_NFS_DEVICE_CONFIG}

networks:
  nginx_internal:
  caddy-1_caddy_net:
    external: true